name: Build APK

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: >
          gradle :app:assembleDebug --no-daemon --stacktrace
          -PbuildSha=${{ github.sha }}
          -PbuildNumber=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aaos-study-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # スマホで 1 タップ取得できるよう、最新 APK を Release に添付。
      # 取得先（固定 URL）: /releases/latest
      - name: Publish APK to rolling "latest" release
        if: github.ref == 'refs/heads/claude/aaos-simulator-app-Dp2qB' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest debug APK
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            最新のデバッグ APK。push のたびに自動更新されます。
            アプリ内の自動アップデートはこの commit を比較に使います。

            build-sha: ${{ github.sha }}
