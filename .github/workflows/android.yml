name: Build APK

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace \
            -PbuildSha=${{ github.sha }} \
            -PbuildNumber=${{ github.run_number }} 2>&1 | tee build.log

      # ビルド失敗時、エラーの要点を PR コメントへ自動投稿（読めるようにする）
      - name: Report build failure to PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          grep -nE "^e: |error: |FAILURE:|What went wrong|Caused by:|FAILED$" build.log \
            | head -80 > err.txt || true
          [ -s err.txt ] || tail -n 80 build.log > err.txt
          PR=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/pulls" \
            | jq -r '.[0].number // empty')
          if [ -n "$PR" ]; then
            jq -Rs --arg sha "${SHA:0:7}" \
              '{body: ("CI build failed for `" + $sha + "`\n\n```\n" + . + "\n```")}' \
              err.txt > payload.json
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$PR/comments" \
              -d @payload.json
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aaos-study-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # スマホで 1 タップ取得できるよう、最新 APK を Release に添付。
      # 取得先（固定 URL）: /releases/latest
      - name: Publish APK to rolling "latest" release
        if: github.ref == 'refs/heads/claude/aaos-simulator-app-Dp2qB' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest debug APK
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            最新のデバッグ APK。push のたびに自動更新されます。
            アプリ内の自動アップデートはこの commit を比較に使います。

            build-sha: ${{ github.sha }}
